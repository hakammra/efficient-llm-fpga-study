name: HDL verification

on:
  push:
    paths:
      - ".github/workflows/hdl.yml"
      - "fpga/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate-and-synthesize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
      - name: Run self-checking simulations
        run: bash fpga/scripts/run_simulations.sh
      - name: Run generic synthesis
        run: bash fpga/scripts/run_synthesis.sh
      - name: Preserve logs and waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdl-evidence
          path: |
            fpga/build/*.log
            fpga/waveforms/*.vcd
          if-no-files-found: warn
